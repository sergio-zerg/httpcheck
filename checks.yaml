# Example checks for `httpcheck --env dev --config checks.yaml`.
# Each top-level key is a check name.

example_homepage:
  protocols: [https]
  domains: [example.com]
  path: /
  method: GET
  status: 200
  format: text        # text | json | xml | yaml
  timeout: 10         # seconds

